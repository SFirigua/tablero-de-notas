server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy de la API al servicio backend por nombre dentro de la red de docker-compose
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: sirve el HTML prerenderizado de la ruta (p. ej. /dashboard -> dashboard.html)
    # y si no existe cae al shell de la SPA (index.html, el `fallback` de adapter-static).
    # `$uri.html` debe ir antes que `$uri/`: si no, /dashboard matchea la carpeta
    # dashboard/ (sin index.html) y nginx responde 403 al recargar.
    location / {
        try_files $uri $uri.html /index.html;
    }
}
