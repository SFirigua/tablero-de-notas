services:
  db:
    image: postgres:15-alpine
    container_name: tablero-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tablero}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tablero-net

  backend:
    build: ./backend
    container_name: tablero-backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambia-esta-clave-en-produccion}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tablero}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://frontend:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tablero-net

  frontend:
    build:
      context: ./frontend
      args:
        # URL de métricas que consume /dashboard (PUBLIC_METRICS_URL).
        # Default: endpoint de Django para que la demo funcione sin servicios extra.
        # Alternativas: http://localhost:3001/metrics (local) o https://<API_GATEWAY>/metrics (AWS).
        PUBLIC_METRICS_URL: ${PUBLIC_METRICS_URL:-http://localhost:8000/api/internal/notes-status/}
    container_name: tablero-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - tablero-net

volumes:
  postgres_data:

networks:
  tablero-net:
    driver: bridge
